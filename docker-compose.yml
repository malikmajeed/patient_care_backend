services:
  db:
    image: postgres:16-alpine
    container_name: patient_care_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-patient_care}
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-Admin123}
    ports:
      - "${DATABASE_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-admin} -d ${DATABASE_NAME:-patient_care}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: patient_care_backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patient_care_api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_NAME: ${DATABASE_NAME:-patient_care}
      DATABASE_USER: ${DATABASE_USER:-admin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-Admin123}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      CLIENT_URL: ${CLIENT_URL:-}
      B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET_ID: ${B2_BUCKET_ID:-}
      B2_PUBLIC_URL: ${B2_PUBLIC_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
